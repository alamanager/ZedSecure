name: aether-build-windows

# Branch-only packaging for the Aether section: Windows MSI + portable,
# same steps as desktop-release's windows job. Does not touch releases.
on:
  push:
    branches: ["aether-section"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msi:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v3

      - name: Read the version
        id: v
        shell: bash
        run: echo "name=$(grep '^zedsecure.versionName=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Take every engine from its own build
        shell: bash
        run: ./tools/get-cores.sh windows

      - name: Take Aether from its own release
        shell: bash
        run: ./tools/get-aether.sh windows

      - name: Build the installer and the portable build
        run: ./gradlew --warning-mode all :desktop:packageMsi :desktop:createDistributable

      - name: Assemble the files
        shell: bash
        run: |
          set -e
          V='${{ steps.v.outputs.name }}'
          mkdir -p dist
          cp desktop/build/compose/binaries/main/msi/*.msi "dist/ZedSecure-$V-aether-x86_64.msi"
          app=$(ls -d desktop/build/compose/binaries/main/app/*/ | head -1)
          ( cd "$(dirname "$app")" && 7z a -tzip -mx=9 "$OLDPWD/dist/ZedSecure-$V-aether-windows-x86_64.zip" "$(basename "$app")" >/dev/null )
          ( cd dist && sha256sum ZedSecure-* > SHA256SUMS.txt )
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-aether
          path: dist/*
          retention-days: 14
